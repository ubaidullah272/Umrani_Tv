<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live TV</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">𓆩UM꧊ꝛ͢𓂃aNi <span>TV</span></a></header><main class="page"><a class="back" href="index.html">← Home</a><h1 class="title">📺 Live TV Channels</h1><div id="list" class="items"></div><section id="player" class="player"><h3 id="playerTitle"></h3><div id="frame" class="frame"></div><div class="controls"><label>Brightness <input type="range" min="50" max="150" value="100" oninput="brightness(this.value)"></label><label>Volume <input type="range" min="0" max="100" value="80" oninput="volume(this.value)"><span id="volumeValue">80%</span></label><button class="btn" onclick="fullscreen()">Fullscreen</button><button class="btn close" onclick="closePlayer()">Close ✕</button></div></section></main><script src="channels.js"></script><script src="player.js"></script><script>const list=document.getElementById('list');if(!window.channels.length)list.innerHTML='<div class="empty">No channels added yet.</div>';window.channels.forEach(c=>{const d=document.createElement('div');d.className='item';const h=document.createElement('h3');h.textContent=c.name;const b=document.createElement('button');b.className='btn';b.textContent='▶ Watch Live';b.onclick=()=>playVideo(c.url,c.name);d.append(h,b);list.append(d)});</script></body></html>
