<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dramas</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">𓆩UM꧊ꝛ͢𓂃aNi <span>TV</span></a></header><main class="page"><a class="back" href="index.html">← Home</a><h1 class="title">🎭 All Dramas</h1><div id="dramaList" class="items"></div><section id="episodes" style="display:none"><button class="back" onclick="backToList()">← Dramas</button><h2 id="dramaName" class="subhead"></h2><img id="poster" class="poster"><div id="episodeList" class="items"></div></section><section id="player" class="player"><h3 id="playerTitle"></h3><div id="frame" class="frame"></div><div class="controls"><label>Brightness <input type="range" min="50" max="150" value="100" oninput="brightness(this.value)"></label><label>Volume <input type="range" min="0" max="100" value="80" oninput="volume(this.value)"><span id="volumeValue">80%</span></label><button class="btn" onclick="fullscreen()">Fullscreen</button><button class="btn close" onclick="closePlayer()">Close ✕</button></div></section></main><script src="dramas.js"></script><script src="player.js"></script><script>const dl=document.getElementById('dramaList');function backToList(){closePlayer();dl.style.display='grid';document.getElementById('episodes').style.display='none'}if(!window.dramas.length)dl.innerHTML='<div class="empty">No dramas added yet.</div>';window.dramas.forEach((d,i)=>{const c=document.createElement('div');c.className='item';const img=document.createElement('img');img.src=d.image;const h=document.createElement('h3');h.textContent=d.name;const b=document.createElement('button');b.className='btn';b.textContent='View Episodes';b.onclick=()=>showEpisodes(i);c.append(img,h,b);dl.append(c)});function showEpisodes(i){const d=window.dramas[i];dl.style.display='none';document.getElementById('episodes').style.display='block';document.getElementById('dramaName').textContent=d.name;document.getElementById('poster').src=d.image;const list=document.getElementById('episodeList');list.innerHTML='';(d.episodes||[]).forEach((e,j)=>{const c=document.createElement('div');c.className='item';const h=document.createElement('h3');h.textContent=e.name||'Episode '+(j+1);const b=document.createElement('button');b.className='btn';b.textContent='▶ Watch Episode';b.onclick=()=>playVideo(e.url,h.textContent);c.append(h,b);list.append(c)});if(!d.episodes||!d.episodes.length)list.innerHTML='<div class="empty">Episodes coming soon.</div>'}</script></body></html>
